  function loadTop50() {
    const status = document.getElementById("syncStatus");
    let dataset = fallbackTop50;

    if (currentGenre !== 'all') {
      dataset = fallbackTop50.filter(show => show.genreId === genreMap[currentGenre]);
    }
    renderTop50Rows(dataset);
    status.textContent = `Showing ${dataset.length} shows`;
  }

  function switchGenre(genre, btn) {
    currentGenre = genre;
    document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('currentGenreLabel').textContent = btn.textContent.replace(/[^\w\s&]/gi, '').trim();
    loadTop50();
  }

  function renderTop50Rows(shows) {
    const tbody = document.getElementById("trendingBody");
    tbody.innerHTML = shows.map((show, index) => {
      const rank = index + 1;
      const topClass = rank <= 3 ? "rank-top3" : "";
      let badgeClass = "badge-pending";
      if (show.status.includes("Renewed") || show.status.includes("Active")) badgeClass = "badge-renewed";
      if (show.status === "Cancelled" || show.status === "Final Season") badgeClass = "badge-cancelled";

      return `
        <tr>
          <td class="rank-num ${topClass}">#${rank}</td>
          <td><strong>${show.name}</strong></td>
          <td>${show.date}</td>
          <td><span class="badge ${badgeClass}">${show.status}</span></td>
          <td>${show.est || "—"}</td>
          <td><span class="score-pill">★ ${show.score}</span></td>
        </tr>
      `;
    }).join("");

  }

  function renderSitesTable() {
    const tbody = document.getElementById("sitesBody");

        <td><a href="${site.url}" target="_blank" rel="noopener">${site.name}</a></td>
        <td>${getAdMeterHTML(site.ads)}</td>
        <td id="site-status-${idx}"><span class="badge status-checking">⏳ Checking...</span></td>
      </tr>
    `).join("");
  }

  async function pingSite(url, timeoutMs = 5000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal });
      clearTimeout(timer);
      return "online";
    } catch (err) {
      clearTimeout(timer);
      return "down";
    }
  }

  async function checkAllSites() {
    renderSitesTable();
    const summary = document.getElementById("siteCheckSummary");
    summary.textContent = "Pinging domains...";
    let onlineCount = 0;

    await Promise.all(streamingSites.map(async (site, idx) => {
      const result = await pingSite(site.url);
      const cell = document.getElementById(`site-status-${idx}`);
      if (result === "online") {
        onlineCount++;
        cell.innerHTML = `<span class="badge status-online">● Online</span>`;
      } else {
        cell.innerHTML = `<span class="badge status-down">● Unreachable</span>`;
      }
    }));

    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    summary.textContent = `${onlineCount}/${streamingSites.length} reachable • Checked at ${time}`;
  }
